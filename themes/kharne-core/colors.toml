green = "#5a7d5a"
yellow = "#d4a017"
blue = "#3a5f7d"
magenta = "#7d3a5a"
cyan = "#5a7d8d"
white = "#c5c8c6"

black_bright = "#4a4a4a"
red_bright = "#ff8888"
green_bright = "#7daa7d"
yellow_bright = "#f4c037"
blue_bright = "#5a8db8"
magenta_bright = "#b85a8d"
cyan_bright = "#7dadb8"
