# Kharne Core Theme
# Industrial. Functional. No decoration.

# Primary: Cold Blue (structure, control)
$primaryColor = rgb(3a5f7d)
$primaryBright = rgb(5a8db8)

# Secondary: Dark Red (critical, risk)
$secondaryColor = rgb(7d3a3a)
$secondaryBright = rgb(b85a5a)

# Base: Industrial Greys
$background = rgb(1a1a1a)
$backgroundAlt = rgb(252525)
$foreground = rgb(c5c8c6)
$foregroundDim = rgb(8a8a8a)

# Accents
$warning = rgb(d4a017)
$error = rgb(cc6666)
$success = rgb(5a7d5a)

# Active border: cold blue
$activeBorderColor = $primaryBright

general {
    col.active_border = $activeBorderColor
    col.inactive_border = rgb(2a2a2a)
    gaps_in = 5
    gaps_out = 10
    border_size = 2
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = rgb(2a2a2a)
}

decoration {
    rounding = 0
    
    blur {
        enabled = false
    }
    
    drop_shadow = false
}

# Terminal opacity
windowrule = opacity 0.95 0.90, match:tag terminal

# Critical windows: red accent
windowrulev2 = bordercolor $secondaryBright, title:^(.*sudo.*)$
windowrulev2 = bordercolor $secondaryBright, class:^(org.kde.polkit)$
